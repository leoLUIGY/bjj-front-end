<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Style.css">
    <title>Guia Bjj</title>
</head>
<body>
    <header>
        <h1>BJJ Catalogo</h1>

        <div class="pesquisar">
            <input type="text" placeholder="Nome do time...">
        </div>
    </header>


    <main>
        <section class="time">
            <h2>Times de jiu-jitsu</h2>

            <button class="btn-primary" id="openCreate">+ Novo Time</button>
            <div class="cards" id="cards">
           
            </div>

            <div class="cadastro-modal" id="cadastro-modal">
                <form class="form-time">
                    <h2 id="formTitulo">Cadastrar Time</h2>

                    <label>Nome do Time</label>
                    <input type="text" id="nome">

                    <label>Pais de Origem</label>
                    <input type="text" id="pais">

                     <label>Data de Fundação</label>
                    <input type="date" id="fundacao">

                    <label>Fundador</label>
                    <input type="text" id="fundador">

                    <label>URL da Logo</label>
                    <input type="text" id="logo">

                    <label>Descrição</label>
                    <textarea rows="5" id="descricao"></textarea>

                    <div class="form-acoes">
                        <button type="button" id="cancelCreate">Cancelar</button>
                        <button type="submit">Salvar</button>
                    </div>
                </form>
            </div>
        </section>

        <button id="openModal">Ver Detalhes</button>

        <section >
            <div class="detalhes" id="detalhes">
                <div class="modal">
                    <button class="fechar-btn" id="fecharModal">x</button>

                    <div class="time-header">
                        <img src="" id="detalheLogo" alt="Logo do time">
                        <div>
                            <h2 id="detalheNome">Nome equipe</h2>
                            <span id="detalhePais">Time</span>
                        </div>
                    </div>

                    <div class="time-info">
                        <h3>Informações</h3>

                        <p><strong>Fundação:</strong> <span id="detalheFundacao">ano</span></p>
                        <p><strong>Fundador: </strong> <span id="detalheDundador">Nome</span></p>
                    </div>

                    <div class="time-descricao">
                        <h3>Descrição</h3>

                        <p id="detalheDescricao">descrição da equipe</p>
                    </div>

                    <div class="modal-acoes">
                        <button class="edit-btn" id="editBtn">Editar</button>
                        <button class="delete-btn" id="deleteBtn">Excluir</button> 
                    </div>
                </div>
            </div>
        </section>
    </main>



    <script src="Script.js"></script>
</body>
</html>
